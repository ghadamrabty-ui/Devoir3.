<h1 style="color:rgb(14, 10, 10)">Gestion des maquillages</h1>
<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">

<h3>Nombre : {{ maquillages?.length }}</h3>      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Prix</th>
            <th>Date</th>
            <th>Type</th>
            @if (authService.isAdmin()) {
            
            }
          </tr>
        </thead>
<tbody>
  <tr *ngFor="let maquillage of maquillages">
    <td>{{ maquillage.idmaquillage }}</td>
    <td>{{ maquillage.nommaquillage }}</td>
    <td>{{ maquillage.prixmaquillage }}</td>
    <td>{{ maquillage.datemaquillage | date:'dd/MM/yyyy' }}</td>
    <td>{{ maquillage.type?.nomtyp }}</td>

    <td *ngIf="authService.isAdmin()">
      <button
        class="btn btn-danger btn-sm me-2"
        (click)="supprimerMaquillage(maquillage)">
        Supprimer
      </button>

      <a
        class="btn btn-success btn-sm"
        [routerLink]="['/modifier-maquillage', maquillage.idmaquillage]">
        Modifier
      </a>
    </td>
  </tr>
  
</tbody>
      </table>

    </div>
  </div>
</div>
