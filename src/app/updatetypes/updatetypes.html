<form>
  <div [hidden]="ajout">
    <label>ID Type</label>
    <input type="text"
      [(ngModel)]="type.idtyp"
      name="idtyp"
      class="form-control w-25"
      readonly>
  </div>

  <div>
    <label>Nom Type</label>
    <input type="text"
      [(ngModel)]="type.nomtyp"
      name="nomtyp"
      class="form-control"
      placeholder="Entrez un nom de type...">
  </div>

  <div class="mt-2">
    <button type="button"
      [disabled]="!type.nomtyp?.trim()"
      class="btn btn-success"
      (click)="saveType()">
      {{ ajout ? 'Ajouter' : 'Modifier' }}
    </button>
  </div>
</form>
