<div class="container mt-4">

  <h2 class="text-center mb-4">Modifier un Maquillage</h2>

  @if (maquillage) {

    <form (ngSubmit)="modifierMaquillage()">

      <div class="mb-3">
        <label class="form-label">ID Maquillage</label>
        <input
          type="number"
          class="form-control"
          name="idMaquillage"
          [(ngModel)]="maquillage.idMaquillage"
          readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Référence</label>
        <input
          type="text"
          class="form-control"
          name="reference"
          [(ngModel)]="maquillage.reference"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Marque</label>
        <input
          type="text"
          class="form-control"
          name="marque"
          [(ngModel)]="maquillage.marque"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Nom du produit</label>
        <input
          type="text"
          class="form-control"
          name="nomProduit"
          [(ngModel)]="maquillage.nomProduit"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Catégorie</label>
        <input
          type="text"
          class="form-control"
          name="categorie"
          [(ngModel)]="maquillage.categorie"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Prix (DT)</label>
        <input
          type="number"
          step="0.001"
          class="form-control"
          name="prix"
          [(ngModel)]="maquillage.prix"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">Date de création</label>
        <input
          type="date"
          class="form-control"
          name="dateCreation"
          [(ngModel)]="maquillage.dateCreation"
          required>
      </div>

      <button type="submit" class="btn btn-primary me-2">
        Modifier
      </button>

      <a routerLink="/maquillage" class="btn btn-secondary">
        Annuler
      </a>

    </form>

  }

</div>
