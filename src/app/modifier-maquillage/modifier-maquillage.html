<div class="container">
    <div>
      <h2>Modifier un Maquillage :</h2>
    </div>

    <form>

      <div class="col-sm-2 col-md-2 col-lg-2">
        <label>ID Maquillage</label>
        <input readonly type="text"
               [(ngModel)]="currentMaquillage.idmaquillage"
               name="idmaquillage"
               class="form-control">
      </div>

      <div class="col-sm-4 col-md-4 col-lg-4">
        <label>Nom Produit</label>
        <input type="text"
               [(ngModel)]="currentMaquillage.nommaquillage"
               name="nommaquillage"
               class="form-control">
      </div>

      <div class="col-sm-2 col-md-2 col-lg-2">
        <label>Prix</label>
        <input type="number"
               [(ngModel)]="currentMaquillage.prixmaquillage"
               name="prixmaquillage"
               class="form-control">
      </div>

      <div class="col-sm-4 col-md-4 col-lg-4">
        <label>Date création</label>
        <input type="date"
               [ngModel]="currentMaquillage.datemaquillage | date:'yyyy-MM-dd'"
               (ngModelChange)="currentMaquillage.datemaquillage = $event"
               name="datemaquillage"
               class="form-control">
      </div>

      <div class="col-sm-4 col-md-4 col-lg-4">
        <label>Type</label>

        <select class="form-control form-control-lg"
                id="idType"
                name="idType"
                [(ngModel)]="modifiedTypeId">

          @for (t of types; track t.idtyp) {
            <option [ngValue]="t.idtyp">
              {{ t.nomtyp }}
            </option>
          }

        </select>
      </div>

      <div class="mt-2">
        <button type="button"
                (click)="updateMaquillage()"
                class="btn btn-success">
          Modifier
        </button>
      </div>

    </form>
</div>
