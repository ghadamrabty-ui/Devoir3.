<div class="container">
    <div>
      <h2>Modifier un Maquillage :</h2>
    </div>
         <form >
             <div  class="col-sm-2 col-md-2 col-lg-2">
               <label >ID  Maquillage</label>
               <input  readonly  type="text"  [(ngModel)]="currentMaquillage.idMaquillage"
                   name="idMaquillage" class="form-control">
              </div>

             <div class="col-sm-4 col-md-4 col-lg-4" >
               <label >Référence</label>
               <input  type="text" [(ngModel)]= "currentMaquillage.reference"
                   name="reference" class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4" >
               <label >Marque</label>
               <input  type="text" [(ngModel)]= "currentMaquillage.marque"
                   name="marque" class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4" >
               <label >Nom Produit</label>
               <input  type="text" [(ngModel)]= "currentMaquillage.nomProduit"
                   name="nomProduit" class="form-control">
             </div>

             <div class="col-sm-2 col-md-2 col-lg-2">
               <label >Prix</label>
           <input type="number"   [(ngModel)]= "currentMaquillage.prix"
                   name="prix" class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4">
                 <label >Date création</label>
                <input  type="date"  [ngModel]="currentMaquillage.dateCreation | date: 'yyyy-MM-dd'"
                   (ngModelChange)=" currentMaquillage.dateCreation= $event"   name="dateCreation"
                   class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4">
              <label>Type</label>
              <select class="form-control form-control-lg" id="idType" name="idType" [(ngModel)]="updatedTypeId">
                @for(t of types; track t.idType)
                {
                  <option  [value]="t.idType">  {{t.nomType}} </option>
                 }
             </select>
             </div>


              <div class="mt-2">
<button type="submit"  (click)="updateMaquillage()" class="btn btn-success">Modifier</button>
              </div>
         </form>
</div>
