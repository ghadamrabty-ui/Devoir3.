    <div class="card shadow mb-4">                   
      <div class="card-body"> 
       <table class="table table-striped">
          <tr> <th>Id</th><th>Nom</th> <th>Prix</th>  <th>Date Création</th> <th>Type</th></tr>    
          @for (produit of maquillages |  searchFilter: searchTerm; track produit.idMaquillage)
      {
          
            
            <tbody  >
              <tr >
                 <td>{{produit.idMaquillage}}</td>
                 <td>{{produit.nomProduit}}</td>
                 <td>{{produit.prix}}</td>
                 <td>{{produit.dateCreation | date:'dd/MM/yyyy'}}</td>
                 <td>{{produit.type?.nomType}}</td>

      }
